# ============================================================================ #
#                        Dependabot Auto-merge Workflow                        #
# ============================================================================ #
# Enables auto-merge for Dependabot pull requests that only contain semver     #
# patch updates. The logic lives in OctalMesh/OctalFont, pinned to a tag like  #
# the other callers (reusable-dependabot-automerge.yaml). The workflow ref of  #
# OctalFont itself is never auto-merged: it moves with the octalfont pin.      #
# ============================================================================ #

name: "Dependabot: Auto-merge"

on:
  pull_request_target:
    branches: ["dev"]
    types: ["opened", "reopened", "synchronize"]

permissions:
  contents: "read"
  pull-requests: "read"

jobs:
  automerge:
    name: "Auto-merge"
    if: github.actor == 'dependabot[bot]'
    uses: OctalMesh/OctalFont/.github/workflows/reusable-dependabot-automerge.yaml@v0.1.0
    secrets: "inherit"
